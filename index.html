<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Distribució automàtica de taules</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .controls {
            max-width: 900px;
            margin: 0 auto 30px auto;
            padding: 25px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .campo {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        label {
            font-weight: bold;
        }

        input[type="number"],
        textarea {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
            font-family: Arial, sans-serif;
        }

        textarea {
            width: 100%;
            min-height: 200px;
            resize: vertical;
            line-height: 1.5;
        }

        .grups-campo {
            grid-column: 1 / -1;
        }

        .ajuda {
            font-size: 13px;
            color: #777;
            margin-top: 3px;
        }

        /* =====================================================
           RESTRICCIONS
           ===================================================== */

        .restriccions {
            grid-column: 1 / -1;

            display: grid;
            grid-template-columns: 1fr 1fr;

            gap: 20px;

            margin-top: 5px;
        }

        .restriccio {
            background: #fafafa;

            border: 1px solid #ddd;
            border-radius: 10px;

            padding: 18px;
        }

        .restriccio h2 {
            margin: 0 0 8px 0;

            font-size: 20px;
        }

        .restriccio-ajuda {
            color: #777;

            font-size: 13px;

            margin-bottom: 15px;

            line-height: 1.4;
        }

        /* =====================================================
           CAIXES DE GRUPS
           ===================================================== */

        .caixes-grups {
            display: flex;
            flex-direction: column;

            gap: 8px;
        }

        .caixa-grup {
            display: flex;

            gap: 8px;
        }

        .selector-container {
            position: relative;

            flex: 1;
        }

        .selector-input {
            width: 100%;

            padding: 10px;

            border: 1px solid #bbb;
            border-radius: 7px;

            font-size: 15px;

            background: white;
        }

        .selector-input:focus {
            outline: none;

            border-color: #555;
        }

        .boto-eliminar-caixa {
            margin: 0;

            padding: 0 12px;

            border: none;
            border-radius: 7px;

            background: #ddd;

            color: #555;

            font-size: 18px;

            cursor: pointer;
        }

        .boto-eliminar-caixa:hover {
            background: #ccc;
        }

        /* =====================================================
           SUGGERIMENTS
           ===================================================== */

        .suggeriments {
            position: absolute;

            top: calc(100% + 2px);
            left: 0;
            right: 0;

            background: white;

            border: 1px solid #ccc;
            border-radius: 7px;

            box-shadow: 0 4px 10px rgba(0,0,0,0.15);

            z-index: 100;

            max-height: 200px;

            overflow-y: auto;

            display: none;
        }

        .suggeriment {
            padding: 10px;

            cursor: pointer;

            border-bottom: 1px solid #eee;
        }

        .suggeriment:last-child {
            border-bottom: none;
        }

        .suggeriment:hover {
            background: #f0f0f0;
        }

        /* =====================================================
           BOTONS RESTRICCIONS
           ===================================================== */

        .boto-afegir-grup {
            width: 100%;

            margin: 10px 0 0 0;

            padding: 9px;

            background: white;

            color: #333;

            border: 1px dashed #aaa;
            border-radius: 7px;

            font-size: 14px;

            cursor: pointer;
        }

        .boto-afegir-grup:hover {
            background: #f0f0f0;
        }

        .boto-restriccio {
            width: 100%;

            margin: 12px 0 0 0;

            padding: 11px;

            border: none;
            border-radius: 7px;

            color: white;

            font-size: 15px;

            cursor: pointer;
        }

        .boto-junts {
            background: #333;
        }

        .boto-junts:hover {
            background: #555;
        }

        .boto-separats {
            background: #333;
        }

        .boto-separats:hover {
            background: #555;
        }

        /* =====================================================
           RESTRICCIONS CREADES
           ===================================================== */

        .llista-restriccions {
            margin-top: 15px;
        }

        .restriccio-creada {
            display: flex;

            align-items: center;
            justify-content: space-between;

            gap: 10px;

            padding: 10px;

            margin-bottom: 8px;

            background: white;

            border: 1px solid #ddd;
            border-radius: 7px;
        }

        .restriccio-text {
            font-size: 13px;

            font-weight: bold;

            line-height: 1.4;
        }

        .boto-eliminar-restriccio {
            margin: 0;

            padding: 5px 9px;

            background: #c44;

            color: white;

            border: none;
            border-radius: 5px;

            font-size: 12px;

            cursor: pointer;

            flex-shrink: 0;
        }

        .boto-eliminar-restriccio:hover {
            background: #a22;
        }

        .missatge-restriccio {
            margin-top: 10px;

            color: #900;

            font-size: 13px;

            display: none;
        }

        /* =====================================================
           BOTÓ PRINCIPAL
           ===================================================== */

        .boto-principal {
            margin-top: 20px;

            padding: 12px 25px;

            border: none;
            border-radius: 7px;

            background: #333;
            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        .boto-principal:hover {
            background: #555;
        }

        /* =====================================================
           MISSATGES
           ===================================================== */

        #missatge {
            max-width: 900px;

            margin: 20px auto;

            padding: 15px;

            border-radius: 8px;

            display: none;
        }

        .error {
            background: #ffd6d6;
            color: #900;
        }

        .info {
            background: #d6e8ff;
            color: #174a80;
        }

        /* =====================================================
           RESULTAT
           ===================================================== */

        #resultat {
            margin-top: 30px;

            overflow-x: auto;

            padding-bottom: 20px;
        }

        .taules {
            display: flex;

            justify-content: center;

            align-items: flex-start;

            gap: 15px;

            min-width: max-content;
        }

        .taula {
            width: 180px;

            min-height: 500px;

            background: #f2f2f2;

            border: 2px solid #222;

            border-radius: 8px;

            padding: 10px;

            position: relative;
        }

        .taula-header {
            text-align: center;

            margin-bottom: 12px;
        }

        .taula-nom {
            font-size: 18px;

            font-weight: bold;
        }

        .ocupacio {
            font-size: 16px;

            margin-top: 5px;
        }

        .percentatge {
            font-size: 13px;

            color: #777;

            margin-top: 3px;
        }

        .grup {
            width: 100%;

            min-height: 35px;

            margin-bottom: 5px;

            padding: 5px;

            border-radius: 4px;

            display: flex;

            align-items: center;

            font-size: 11px;

            font-weight: bold;

            overflow: hidden;
        }

        .resum {
            max-width: 900px;

            margin: 30px auto;

            padding: 20px;

            background: white;

            border-radius: 10px;

            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .resum h2 {
            margin-top: 0;
        }

        .resum-taula {
            margin-bottom: 20px;
        }

        .resum-grup {
            margin-left: 20px;

            margin-top: 5px;
        }

        /* =====================================================
           MÒBIL
           ===================================================== */

        @media (max-width: 700px) {

            body {
                padding: 15px;
            }

            .controls-grid {
                grid-template-columns: 1fr;
            }

            .grups-campo {
                grid-column: auto;
            }

            .restriccions {
                grid-column: auto;

                grid-template-columns: 1fr;
            }

            .taula {
                width: 160px;
            }

        }

    </style>
</head>

<body>

    <h1>Distribució automàtica de taules</h1>


    <div class="controls">

        <div class="controls-grid">


            <!-- =================================================
                 NÚMERO DE TAULES
                 ================================================= -->

            <div class="campo">

                <label for="numTaules">
                    Número de taules
                </label>

                <input
                    type="number"
                    id="numTaules"
                    min="1"
                    value="10"
                >

            </div>


            <!-- =================================================
                 CAPACITAT
                 ================================================= -->

            <div class="campo">

                <label for="capacitat">
                    Capacitat màxima per taula
                </label>

                <input
                    type="number"
                    id="capacitat"
                    min="1"
                    value="10"
                >

            </div>


            <!-- =================================================
                 GRUPS
                 ================================================= -->

            <div class="campo grups-campo">

                <label for="textGrups">
                    Grups
                </label>

                <textarea
                    id="textGrups"
                    placeholder="Escriu un grup per línia, amb el nombre de persones al final.

Exemple:
Família Garcia 4
Amics Joan 6
Club de futbol 8
Escola 3
Pares 5"
                ></textarea>

                <div class="ajuda">
                    Escriu un grup per línia i posa el nombre de persones al final.
                </div>

            </div>


            <!-- =================================================
                 RESTRICCIONS
                 ================================================= -->

            <div class="restriccions">


                <!-- =================================================
                     GRUPS JUNTS
                     ================================================= -->

                <div class="restriccio">

                    <h2> 💐Grups junts👨🏻‍❤️‍💋‍👨🏻 </h2>

                    <div class="restriccio-ajuda">
                        Afegeix tots els grups que vols que
                        estiguin junts i consecutius a la mateixa taula.
                    </div>


                    <div
                        id="caixesJunts"
                        class="caixes-grups"
                    ></div>


                    <button
                        type="button"
                        class="boto-afegir-grup"
                        onclick="afegirCaixaJunt()"
                    >
                        + Afegir grup
                    </button>


                    <button
                        type="button"
                        class="boto-restriccio boto-junts"
                        onclick="crearRestriccioJunts()"
                    >
                        Ajuntar grups
                    </button>


                    <div
                        id="missatgeJunts"
                        class="missatge-restriccio"
                    ></div>


                    <div
                        id="llistaJunts"
                        class="llista-restriccions"
                    ></div>

                </div>


                <!-- =================================================
                     GRUPS SEPARATS
                     ================================================= -->

                <div class="restriccio">

                    <h2> 😡Grups separats⛔ </h2>

                    <div class="restriccio-ajuda">
                        Afegeix tots els grups que no poden
                        compartir taula entre ells.
                    </div>


                    <div
                        id="caixesSeparats"
                        class="caixes-grups"
                    ></div>


                    <button
                        type="button"
                        class="boto-afegir-grup"
                        onclick="afegirCaixaSeparat()"
                    >
                        + Afegir grup
                    </button>


                    <button
                        type="button"
                        class="boto-restriccio boto-separats"
                        onclick="crearRestriccioSeparats()"
                    >
                        Separar grups
                    </button>


                    <div
                        id="missatgeSeparats"
                        class="missatge-restriccio"
                    ></div>


                    <div
                        id="llistaSeparats"
                        class="llista-restriccions"
                    ></div>

                </div>

            </div>

        </div>


        <!-- =================================================
             BOTÓ PRINCIPAL
             ================================================= -->

        <button
            type="button"
            class="boto-principal"
            onclick="calcular()"
        >
            Distribuir grups
        </button>

    </div>


    <div id="missatge"></div>

    <div id="resultat"></div>


    <script>


        // =====================================================
        // COLORS
        // =====================================================

        const colorsDisponibles = [

            "#FFD6D6",
            "#D6E8FF",
            "#D6F5D6",
            "#FFF0C2",
            "#E8D6FF",
            "#FFDCC2",
            "#D6F5F5",
            "#F5D6E8",
            "#E8E8E8",
            "#FFF5D6",

            "#FFCCCC",
            "#CCE0FF",
            "#CCFFCC",
            "#FFFFCC",
            "#E0CCFF",
            "#FFD9B3",
            "#CCFFFF",
            "#FFCCE6",
            "#D9D9D9",
            "#FFE6CC",

            "#F4CCCC",
            "#CFE2F3",
            "#D9EAD3",
            "#FFF2CC",
            "#D9D2E9",
            "#FCE5CD",
            "#D0E0E3",
            "#EAD1DC",
            "#EFEFEF",
            "#F9CB9C",

            "#EA9999",
            "#9FC5E8",
            "#A9D18E",
            "#FFD966",
            "#B4A7D6",
            "#F6B26B",
            "#76D7C4",
            "#D5A6BD",
            "#B7B7B7",
            "#F4B183"

        ];


        // =====================================================
        // VARIABLES DE RESTRICCIONS
        // =====================================================

        let restriccionsJunts = [];

        let restriccionsSeparats = [];


        // =====================================================
        // LLEGIR GRUPS
        // =====================================================

        function llegirGrups(text) {

            const grups = [];

            const linies =
                text.split(/\r?\n/);


            for (let linia of linies) {

                linia = linia.trim();


                if (!linia) {
                    continue;
                }


                const parts =
                    linia.split(/\s+/);


                const mida =
                    parseInt(
                        parts[parts.length - 1]
                    );


                if (isNaN(mida)) {

                    throw new Error(
                        `Format incorrecte a la línia: "${linia}"`
                    );

                }


                if (mida <= 0) {

                    throw new Error(
                        `El nombre de persones del grup `
                        + `"${linia}" ha de ser superior a 0.`
                    );

                }


                const nom =
                    parts
                        .slice(0, -1)
                        .join(" ");


                if (!nom) {

                    throw new Error(
                        `Falta el nom del grup a la línia: "${linia}"`
                    );

                }


                grups.push({

                    nom: nom,

                    mida: mida

                });

            }


            return grups;
        }


        // =====================================================
        // OBTENIR NOMS DELS GRUPS
        // =====================================================

        function obtenirNomsGrups() {

            try {

                const text =
                    document.getElementById(
                        "textGrups"
                    ).value;


                if (!text.trim()) {
                    return [];
                }


                return llegirGrups(text)
                    .map(grup => grup.nom);

            } catch (error) {

                return [];

            }
        }


        // =====================================================
        // CREAR UNA CAIXA DE GRUP
        // =====================================================

        function crearCaixaGrup(
            contenidorId
        ) {

            const contenidor =
                document.getElementById(
                    contenidorId
                );


            const caixa =
                document.createElement("div");


            caixa.className =
                "caixa-grup";


            const selector =
                document.createElement("div");


            selector.className =
                "selector-container";


            const input =
                document.createElement("input");


            input.type =
                "text";


            input.className =
                "selector-input";


            input.placeholder =
                "Escriu el nom del grup...";


            input.autocomplete =
                "off";


            const suggeriments =
                document.createElement("div");


            suggeriments.className =
                "suggeriments";


            // ---------------------------------------------
            // Autocompletat
            // ---------------------------------------------

            input.addEventListener(
                "input",
                function() {

                    mostrarSuggeriments(
                        input,
                        suggeriments
                    );

                }
            );


            input.addEventListener(
                "focus",
                function() {

                    if (
                        input.value.trim()
                    ) {

                        mostrarSuggeriments(
                            input,
                            suggeriments
                        );

                    }

                }
            );


            selector.appendChild(input);

            selector.appendChild(suggeriments);


            // ---------------------------------------------
            // Botó eliminar caixa
            // ---------------------------------------------

            const botoEliminar =
                document.createElement(
                    "button"
                );


            botoEliminar.type =
                "button";


            botoEliminar.className =
                "boto-eliminar-caixa";


            botoEliminar.textContent =
                "×";


            botoEliminar.title =
                "Eliminar grup";


            botoEliminar.onclick =
                function() {

                    caixa.remove();

                };


            caixa.appendChild(selector);

            caixa.appendChild(botoEliminar);


            contenidor.appendChild(caixa);


            input.focus();
        }


        // =====================================================
        // AFEGIR CAIXA JUNTS
        // =====================================================

        function afegirCaixaJunt() {

            crearCaixaGrup(
                "caixesJunts"
            );

        }


        // =====================================================
        // AFEGIR CAIXA SEPARATS
        // =====================================================

        function afegirCaixaSeparat() {

            crearCaixaGrup(
                "caixesSeparats"
            );

        }


        // =====================================================
        // SUGGERIMENTS
        // =====================================================

        function mostrarSuggeriments(
            input,
            contenidor
        ) {

            const text =
                input.value
                    .trim()
                    .toLowerCase();


            const noms =
                obtenirNomsGrups();


            contenidor.innerHTML = "";


            if (
                !text
                ||
                noms.length === 0
            ) {

                contenidor.style.display =
                    "none";

                return;
            }


            const coincidencies =
                noms.filter(
                    nom =>
                        nom.toLowerCase()
                            .includes(text)
                );


            if (
                coincidencies.length === 0
            ) {

                contenidor.style.display =
                    "none";

                return;
            }


            for (
                const nom of coincidencies
            ) {

                const element =
                    document.createElement(
                        "div"
                    );


                element.className =
                    "suggeriment";


                element.textContent =
                    nom;


                element.addEventListener(
                    "mousedown",
                    function(event) {

                        event.preventDefault();


                        input.value =
                            nom;


                        contenidor.style.display =
                            "none";

                    }
                );


                contenidor.appendChild(
                    element
                );

            }


            contenidor.style.display =
                "block";
        }


        // =====================================================
        // OBTENIR VALORS D'UN CONTENIDOR
        // =====================================================

        function obtenirValorsCaixes(
            contenidorId
        ) {

            const contenidor =
                document.getElementById(
                    contenidorId
                );


            const inputs =
                contenidor.querySelectorAll(
                    ".selector-input"
                );


            const valors = [];


            for (
                const input of inputs
            ) {

                const valor =
                    input.value.trim();


                if (valor) {

                    valors.push(valor);

                }

            }


            return valors;
        }


        // =====================================================
        // NORMALITZAR NOMS
        // =====================================================

        function trobarNomExacte(
            nom,
            noms
        ) {

            return noms.find(
                n =>
                    n.toLowerCase()
                    ===
                    nom.toLowerCase()
            );

        }


        // =====================================================
        // CREAR RESTRICCIÓ JUNTS
        // =====================================================

        function crearRestriccioJunts() {

            ocultarMissatgeRestriccio(
                "missatgeJunts"
            );


            const valors =
                obtenirValorsCaixes(
                    "caixesJunts"
                );


            if (
                valors.length < 2
            ) {

                mostrarErrorRestriccio(
                    "missatgeJunts",
                    "Has d'afegir com a mínim dos grups."
                );

                return;
            }


            const noms =
                obtenirNomsGrups();


            const grups = [];


            for (
                const valor of valors
            ) {

                const nom =
                    trobarNomExacte(
                        valor,
                        noms
                    );


                if (!nom) {

                    mostrarErrorRestriccio(
                        "missatgeJunts",
                        `"${valor}" no és un grup vàlid. Selecciona un grup de la llista.`
                    );

                    return;
                }


                if (
                    grups.includes(nom)
                ) {

                    mostrarErrorRestriccio(
                        "missatgeJunts",
                        `El grup "${nom}" està repetit.`
                    );

                    return;
                }


                grups.push(nom);
            }


            // ---------------------------------------------
            // Comprovar si ja està dins d'una restricció
            // ---------------------------------------------

            for (
                const grup of grups
            ) {

                for (
                    const restriccio
                    of restriccionsJunts
                ) {

                    if (
                        restriccio.includes(grup)
                    ) {

                        mostrarErrorRestriccio(
                            "missatgeJunts",
                            `El grup "${grup}" ja forma part d'una altra restricció de grups junts.`
                        );

                        return;
                    }

                }

            }


            // ---------------------------------------------
            // Crear restricció
            // ---------------------------------------------

            restriccionsJunts.push(
                grups
            );


            // ---------------------------------------------
            // Netejar caixes
            // ---------------------------------------------

            document.getElementById(
                "caixesJunts"
            ).innerHTML = "";


            afegirCaixaJunt();


            dibuixarRestriccionsJunts();
        }


        // =====================================================
        // DIBUIXAR RESTRICCIONS JUNTS
        // =====================================================

        function dibuixarRestriccionsJunts() {

            const contenidor =
                document.getElementById(
                    "llistaJunts"
                );


            contenidor.innerHTML = "";


            restriccionsJunts.forEach(
                (
                    restriccio,
                    index
                ) => {

                    const element =
                        document.createElement(
                            "div"
                        );


                    element.className =
                        "restriccio-creada";


                    const text =
                        document.createElement(
                            "div"
                        );


                    text.className =
                        "restriccio-text";


                    text.textContent =
                        restriccio.join(" + ");


                    const boto =
                        document.createElement(
                            "button"
                        );


                    boto.type =
                        "button";


                    boto.className =
                        "boto-eliminar-restriccio";


                    boto.textContent =
                        "Eliminar";


                    boto.onclick =
                        function() {

                            restriccionsJunts
                                .splice(index, 1);


                            dibuixarRestriccionsJunts();

                        };


                    element.appendChild(
                        text
                    );


                    element.appendChild(
                        boto
                    );


                    contenidor.appendChild(
                        element
                    );

                }
            );
        }


        // =====================================================
        // CREAR RESTRICCIÓ SEPARATS
        // =====================================================

        function crearRestriccioSeparats() {

            ocultarMissatgeRestriccio(
                "missatgeSeparats"
            );


            const valors =
                obtenirValorsCaixes(
                    "caixesSeparats"
                );


            if (
                valors.length < 2
            ) {

                mostrarErrorRestriccio(
                    "missatgeSeparats",
                    "Has d'afegir com a mínim dos grups."
                );

                return;
            }


            const noms =
                obtenirNomsGrups();


            const grups = [];


            for (
                const valor of valors
            ) {

                const nom =
                    trobarNomExacte(
                        valor,
                        noms
                    );


                if (!nom) {

                    mostrarErrorRestriccio(
                        "missatgeSeparats",
                        `"${valor}" no és un grup vàlid. Selecciona un grup de la llista.`
                    );

                    return;
                }


                if (
                    grups.includes(nom)
                ) {

                    mostrarErrorRestriccio(
                        "missatgeSeparats",
                        `El grup "${nom}" està repetit.`
                    );

                    return;
                }


                grups.push(nom);
            }


            // ---------------------------------------------
            // Crear totes les incompatibilitats
            //
            // Exemple:
            //
            // A
            // B
            // C
            //
            // crea:
            //
            // A-B
            // A-C
            // B-C
            // ---------------------------------------------

            for (
                let i = 0;
                i < grups.length;
                i++
            ) {

                for (
                    let j = i + 1;
                    j < grups.length;
                    j++
                ) {

                    const a =
                        grups[i];

                    const b =
                        grups[j];


                    const existeix =
                        restriccionsSeparats.some(
                            parella =>

                                (
                                    parella[0] === a
                                    &&
                                    parella[1] === b
                                )
                                ||
                                (
                                    parella[0] === b
                                    &&
                                    parella[1] === a
                                )
                        );


                    if (!existeix) {

                        restriccionsSeparats.push([
                            a,
                            b
                        ]);

                    }

                }

            }


            // ---------------------------------------------
            // Netejar
            // ---------------------------------------------

            document.getElementById(
                "caixesSeparats"
            ).innerHTML = "";


            afegirCaixaSeparat();


            dibuixarRestriccionsSeparats();
        }


        // =====================================================
        // DIBUIXAR RESTRICCIONS SEPARATS
        // =====================================================

        function dibuixarRestriccionsSeparats() {

            const contenidor =
                document.getElementById(
                    "llistaSeparats"
                );


            contenidor.innerHTML = "";


            restriccionsSeparats.forEach(
                (
                    restriccio,
                    index
                ) => {

                    const element =
                        document.createElement(
                            "div"
                        );


                    element.className =
                        "restriccio-creada";


                    const text =
                        document.createElement(
                            "div"
                        );


                    text.className =
                        "restriccio-text";


                    text.textContent =
                        `${restriccio[0]} ↔ ${restriccio[1]}`;


                    const boto =
                        document.createElement(
                            "button"
                        );


                    boto.type =
                        "button";


                    boto.className =
                        "boto-eliminar-restriccio";


                    boto.textContent =
                        "Eliminar";


                    boto.onclick =
                        function() {

                            restriccionsSeparats
                                .splice(index, 1);


                            dibuixarRestriccionsSeparats();

                        };


                    element.appendChild(
                        text
                    );


                    element.appendChild(
                        boto
                    );


                    contenidor.appendChild(
                        element
                    );

                }
            );
        }


        // =====================================================
        // TANCAR SUGGERIMENTS
        // =====================================================

        document.addEventListener(
            "click",
            function(event) {

                if (
                    !event.target.closest(
                        ".selector-container"
                    )
                ) {

                    document
                        .querySelectorAll(
                            ".suggeriments"
                        )
                        .forEach(
                            element => {

                                element.style.display =
                                    "none";

                            }
                        );

                }

            }
        );


        // =====================================================
        // ORDRE CENTRAL
        // =====================================================

        function ordreCentral(
            numTaules
        ) {

            const centre =
                (numTaules - 1) / 2;


            const ordre = [];


            for (
                let i = 0;
                i < numTaules;
                i++
            ) {

                ordre.push(i);

            }


            ordre.sort(
                (a, b) => {

                    return Math.abs(a - centre)
                         -
                           Math.abs(b - centre);

                }
            );


            return ordre;
        }


        // =====================================================
        // CREAR BLOCS DE GRUPS JUNTS
        // =====================================================

        function crearBlocs(
            grups,
            consecutius,
            incompatibles
        ) {

            const mapaGrups =
                new Map();


            for (
                const grup of grups
            ) {

                if (
                    mapaGrups.has(
                        grup.nom
                    )
                ) {

                    throw new Error(
                        `El grup "${grup.nom}" apareix més d'una vegada.`
                    );

                }


                mapaGrups.set(
                    grup.nom,
                    grup
                );

            }


            const grupEnBloc =
                new Map();


            const blocs = [];


            // ---------------------------------------------
            // Blocs de grups junts
            // ---------------------------------------------

            for (
                const cadena of consecutius
            ) {

                const bloc = [];


                for (
                    const nom of cadena
                ) {

                    if (
                        !mapaGrups.has(
                            nom
                        )
                    ) {

                        throw new Error(
                            `El grup "${nom}" de "Grups junts" no existeix.`
                        );

                    }


                    if (
                        grupEnBloc.has(
                            nom
                        )
                    ) {

                        throw new Error(
                            `El grup "${nom}" apareix en més d'una restricció de "Grups junts".`
                        );

                    }


                    bloc.push(
                        mapaGrups.get(
                            nom
                        )
                    );


                    grupEnBloc.set(
                        nom,
                        blocs.length
                    );

                }


                blocs.push(
                    bloc
                );

            }


            // ---------------------------------------------
            // Grups sense bloc
            // ---------------------------------------------

            for (
                const grup of grups
            ) {

                if (
                    !grupEnBloc.has(
                        grup.nom
                    )
                ) {

                    blocs.push([
                        grup
                    ]);

                }

            }


            // ---------------------------------------------
            // Comprovar incompatibilitats
            // dins del mateix bloc
            // ---------------------------------------------

            for (
                const parella
                of incompatibles
            ) {

                const grupA =
                    parella[0];

                const grupB =
                    parella[1];


                const blocA =
                    grupEnBloc.get(
                        grupA
                    );


                const blocB =
                    grupEnBloc.get(
                        grupB
                    );


                if (
                    blocA !== undefined
                    &&
                    blocA === blocB
                ) {

                    throw new Error(
                        `Impossible: "${grupA}" i "${grupB}" `
                        +
                        `han d'anar junts però també `
                        +
                        `estan marcats com a separats.`
                    );

                }

            }


            return blocs;
        }


        // =====================================================
        // COMPROVAR SI UN BLOC POT ANAR A UNA TAULA
        // =====================================================

        function blocPotAnarATaula(
            bloc,
            taula,
            ocupacio,
            capacitat,
            incompatiblesMapa,
            taules
        ) {

            const midaBloc =
                bloc.reduce(
                    (
                        total,
                        grup
                    ) =>
                        total + grup.mida,
                    0
                );


            // ---------------------------------------------
            // Capacitat
            // ---------------------------------------------

            if (
                ocupacio[taula]
                +
                midaBloc
                >
                capacitat
            ) {

                return false;

            }


            // ---------------------------------------------
            // Incompatibilitats
            // ---------------------------------------------

            for (
                const grupBloc
                of bloc
            ) {

                for (
                    const grupTaula
                    of taules[taula]
                ) {

                    if (
                        incompatiblesMapa
                            .get(
                                grupBloc.nom
                            )
                            ?.has(
                                grupTaula.nom
                            )
                    ) {

                        return false;

                    }

                }

            }


            return true;
        }


        // =====================================================
        // REPARTIMENT
        // =====================================================

        function repartirGrups(
            grups,
            numTaules,
            capacitat,
            consecutius,
            incompatibles
        ) {

            // ---------------------------------------------
            // Mapa d'incompatibilitats
            // ---------------------------------------------

            const incompatiblesMapa =
                new Map();


            for (
                const parella
                of incompatibles
            ) {

                const a =
                    parella[0];

                const b =
                    parella[1];


                if (
                    !incompatiblesMapa.has(a)
                ) {

                    incompatiblesMapa.set(
                        a,
                        new Set()
                    );

                }


                if (
                    !incompatiblesMapa.has(b)
                ) {

                    incompatiblesMapa.set(
                        b,
                        new Set()
                    );

                }


                incompatiblesMapa
                    .get(a)
                    .add(b);


                incompatiblesMapa
                    .get(b)
                    .add(a);

            }


            // ---------------------------------------------
            // Crear blocs
            // ---------------------------------------------

            const blocs =
                crearBlocs(
                    grups,
                    consecutius,
                    incompatibles
                );


            // ---------------------------------------------
            // Comprovar mida blocs
            // ---------------------------------------------

            for (
                const bloc
                of blocs
            ) {

                const mida =
                    bloc.reduce(
                        (
                            total,
                            grup
                        ) =>
                            total + grup.mida,
                        0
                    );


                if (
                    mida > capacitat
                ) {

                    const noms =
                        bloc
                            .map(
                                grup =>
                                    grup.nom
                            )
                            .join(" + ");


                    throw new Error(
                        `El grup conjunt "${noms}" té ${mida} persones `
                        +
                        `i no cap en una taula de ${capacitat}.`
                    );

                }

            }


            // ---------------------------------------------
            // Ordenar blocs de més gran a més petit
            // ---------------------------------------------

            const blocsOrdenats =
                [...blocs].sort(
                    (
                        a,
                        b
                    ) => {

                        const midaA =
                            a.reduce(
                                (
                                    total,
                                    grup
                                ) =>
                                    total + grup.mida,
                                0
                            );


                        const midaB =
                            b.reduce(
                                (
                                    total,
                                    grup
                                ) =>
                                    total + grup.mida,
                                0
                            );


                        return midaB - midaA;

                    }
                );


            // ---------------------------------------------
            // Crear taules
            // ---------------------------------------------

            const taules = [];

            const ocupacio = [];


            for (
                let i = 0;
                i < numTaules;
                i++
            ) {

                taules.push([]);

                ocupacio.push(0);

            }


            const ordre =
                ordreCentral(
                    numTaules
                );


            // ---------------------------------------------
            // Repartir blocs
            // ---------------------------------------------

            for (
                const bloc
                of blocsOrdenats
            ) {

                let millorTaula =
                    null;


                let millorResultat =
                    null;


                for (
                    const t
                    of ordre
                ) {

                    if (
                        blocPotAnarATaula(
                            bloc,
                            t,
                            ocupacio,
                            capacitat,
                            incompatiblesMapa,
                            taules
                        )
                    ) {

                        const midaBloc =
                            bloc.reduce(
                                (
                                    total,
                                    grup
                                ) =>
                                    total + grup.mida,
                                0
                            );


                        const novaOcupacio =
                            ocupacio[t]
                            +
                            midaBloc;


                        if (
                            millorResultat === null
                            ||
                            novaOcupacio
                            >
                            millorResultat
                        ) {

                            millorResultat =
                                novaOcupacio;


                            millorTaula =
                                t;

                        }

                    }

                }


                // -----------------------------------------
                // No hi ha taula possible
                // -----------------------------------------

                if (
                    millorTaula === null
                ) {

                    const noms =
                        bloc
                            .map(
                                grup =>
                                    grup.nom
                            )
                            .join(" + ");


                    throw new Error(
                        `No s'ha pogut col·locar "${noms}" `
                        +
                        `respectant les restriccions.`
                    );

                }


                // -----------------------------------------
                // Afegir el bloc sencer
                //
                // Això garanteix que els grups junts
                // queden consecutius.
                // -----------------------------------------

                for (
                    const grup
                    of bloc
                ) {

                    taules[millorTaula]
                        ?.push(grup);

                }


                // Corregim l'assignació de manera explícita
                // per evitar qualsevol ambigüitat.

                for (
                    const grup
                    of bloc
                ) {

                    // Si encara no s'ha afegit correctament,
                    // no fem res aquí.
                }


                // Calculem l'ocupació del bloc

                const midaBloc =
                    bloc.reduce(
                        (
                            total,
                            grup
                        ) =>
                            total + grup.mida,
                        0
                    );


                ocupacio[millorTaula]
                    += midaBloc;

            }


            // =================================================
            // REORDENAR TAULES
            // =================================================

            const dades = [];


            for (
                let i = 0;
                i < numTaules;
                i++
            ) {

                dades.push({

                    taula:
                        taules[i],

                    ocup:
                        ocupacio[i]

                });

            }


            dades.sort(
                (
                    a,
                    b
                ) =>
                    b.ocup - a.ocup
            );


            const taulesNoves =
                Array(
                    numTaules
                );


            const ocupacioNova =
                Array(
                    numTaules
                );


            for (
                let i = 0;
                i < ordre.length;
                i++
            ) {

                const posicio =
                    ordre[i];


                const dada =
                    dades[i];


                taulesNoves[posicio] =
                    dada.taula;


                ocupacioNova[posicio] =
                    dada.ocup;

            }


            return {

                taules:
                    taulesNoves,

                ocupacio:
                    ocupacioNova

            };
        }


        // =====================================================
        // DIBUIXAR TAULES
        // =====================================================

        function dibuixarTaules(
            taules,
            ocupacio,
            capacitat
        ) {

            const resultat =
                document.getElementById(
                    "resultat"
                );


            resultat.innerHTML = "";


            const contenidor =
                document.createElement(
                    "div"
                );


            contenidor.className =
                "taules";


            const colors = {};

            let numeroColor = 0;


            for (
                let i = 0;
                i < taules.length;
                i++
            ) {

                const taula =
                    document.createElement(
                        "div"
                    );


                taula.className =
                    "taula";


                // -----------------------------------------
                // CAPÇALERA
                // -----------------------------------------

                const header =
                    document.createElement(
                        "div"
                    );


                header.className =
                    "taula-header";


                const nomTaula =
                    document.createElement(
                        "div"
                    );


                nomTaula.className =
                    "taula-nom";


                nomTaula.textContent =
                    `TAULA ${i + 1}`;


                const ocupacioText =
                    document.createElement(
                        "div"
                    );


                ocupacioText.className =
                    "ocupacio";


                ocupacioText.textContent =
                    `${ocupacio[i]}/${capacitat}`;


                const percentatge =
                    document.createElement(
                        "div"
                    );


                percentatge.className =
                    "percentatge";


                const percent =
                    ocupacio[i]
                    /
                    capacitat
                    *
                    100;


                percentatge.textContent =
                    `${Math.round(percent)}%`;


                header.appendChild(
                    nomTaula
                );


                header.appendChild(
                    ocupacioText
                );


                header.appendChild(
                    percentatge
                );


                taula.appendChild(
                    header
                );


                // -----------------------------------------
                // GRUPS
                // -----------------------------------------

                for (
                    const grup
                    of taules[i]
                ) {

                    if (
                        !colors[grup.nom]
                    ) {

                        colors[grup.nom] =
                            colorsDisponibles[
                                numeroColor
                                %
                                colorsDisponibles.length
                            ];


                        numeroColor++;
                    }


                    const bloc =
                        document.createElement(
                            "div"
                        );


                    bloc.className =
                        "grup";


                    bloc.style.backgroundColor =
                        colors[grup.nom];


                    bloc.textContent =
                        `${grup.nom} (${grup.mida})`;


                    taula.appendChild(
                        bloc
                    );

                }


                contenidor.appendChild(
                    taula
                );

            }


            resultat.appendChild(
                contenidor
            );


            crearResum(
                taules,
                ocupacio,
                capacitat
            );
        }


        // =====================================================
        // RESUM
        // =====================================================

        function crearResum(
            taules,
            ocupacio,
            capacitat
        ) {

            const resultat =
                document.getElementById(
                    "resultat"
                );


            const resum =
                document.createElement(
                    "div"
                );


            resum.className =
                "resum";


            const titol =
                document.createElement(
                    "h2"
                );


            titol.textContent =
                "Resultat";


            resum.appendChild(
                titol
            );


            for (
                let i = 0;
                i < taules.length;
                i++
            ) {

                const taula =
                    document.createElement(
                        "div"
                    );


                taula.className =
                    "resum-taula";


                const percent =
                    Math.round(
                        ocupacio[i]
                        /
                        capacitat
                        *
                        100
                    );


                const titolTaula =
                    document.createElement(
                        "strong"
                    );


                titolTaula.textContent =
                    `Taula ${i + 1} — `
                    +
                    `${ocupacio[i]}/${capacitat} `
                    +
                    `(${percent}%)`;


                taula.appendChild(
                    titolTaula
                );


                for (
                    const grup
                    of taules[i]
                ) {

                    const grupElement =
                        document.createElement(
                            "div"
                        );


                    grupElement.className =
                        "resum-grup";


                    grupElement.textContent =
                        `- ${grup.nom}: `
                        +
                        `${grup.mida}`;


                    taula.appendChild(
                        grupElement
                    );

                }


                resum.appendChild(
                    taula
                );

            }


            resultat.appendChild(
                resum
            );
        }


        // =====================================================
        // MISSATGES
        // =====================================================

        function mostrarMissatge(
            text,
            tipus
        ) {

            const element =
                document.getElementById(
                    "missatge"
                );


            element.textContent =
                text;


            element.className =
                tipus;


            element.style.display =
                "block";
        }


        function ocultarMissatge() {

            const element =
                document.getElementById(
                    "missatge"
                );


            element.style.display =
                "none";
        }


        function mostrarErrorRestriccio(
            id,
            text
        ) {

            const element =
                document.getElementById(
                    id
                );


            element.textContent =
                text;


            element.style.display =
                "block";
        }


        function ocultarMissatgeRestriccio(
            id
        ) {

            const element =
                document.getElementById(
                    id
                );


            element.style.display =
                "none";
        }


        // =====================================================
        // PROGRAMA PRINCIPAL
        // =====================================================

        function calcular() {

            ocultarMissatge();


            try {

                const numTaules =
                    parseInt(
                        document.getElementById(
                            "numTaules"
                        ).value
                    );


                const capacitat =
                    parseInt(
                        document.getElementById(
                            "capacitat"
                        ).value
                    );


                const text =
                    document.getElementById(
                        "textGrups"
                    ).value;


                // ---------------------------------------------
                // VALIDACIONS
                // ---------------------------------------------

                if (
                    isNaN(numTaules)
                    ||
                    numTaules <= 0
                ) {

                    throw new Error(
                        "El número de taules no és vàlid."
                    );

                }


                if (
                    isNaN(capacitat)
                    ||
                    capacitat <= 0
                ) {

                    throw new Error(
                        "La capacitat no és vàlida."
                    );

                }


                if (
                    !text.trim()
                ) {

                    throw new Error(
                        "Escriu almenys un grup."
                    );

                }


                // ---------------------------------------------
                // LLEGIR GRUPS
                // ---------------------------------------------

                const grups =
                    llegirGrups(
                        text
                    );


                if (
                    grups.length === 0
                ) {

                    throw new Error(
                        "No s'ha trobat cap grup."
                    );

                }


                // ---------------------------------------------
                // TOTAL PERSONES
                // ---------------------------------------------

                const totalPersones =
                    grups.reduce(
                        (
                            total,
                            grup
                        ) =>
                            total + grup.mida,
                        0
                    );


                if (
                    totalPersones
                    >
                    numTaules * capacitat
                ) {

                    throw new Error(
                        "No hi ha prou cadires per a tothom."
                    );

                }


                // ---------------------------------------------
                // COMPROVAR GRUPS INDIVIDUALS
                // ---------------------------------------------

                for (
                    const grup
                    of grups
                ) {

                    if (
                        grup.mida
                        >
                        capacitat
                    ) {

                        throw new Error(
                            `El grup "${grup.nom}" `
                            +
                            `té ${grup.mida} persones `
                            +
                            `i no cap en una taula `
                            +
                            `de ${capacitat}.`
                        );

                    }

                }


                // ---------------------------------------------
                // REPARTIR
                // ---------------------------------------------

                const resultat =
                    repartirGrups(
                        grups,
                        numTaules,
                        capacitat,
                        restriccionsJunts,
                        restriccionsSeparats
                    );


                // ---------------------------------------------
                // DIBUIXAR
                // ---------------------------------------------

                dibuixarTaules(
                    resultat.taules,
                    resultat.ocupacio,
                    capacitat
                );


                mostrarMissatge(
                    `Total persones: ${totalPersones}`,
                    "info"
                );


            } catch (
                error
            ) {

                mostrarMissatge(
                    error.message,
                    "error"
                );


                document.getElementById(
                    "resultat"
                ).innerHTML = "";

            }
        }


        // =====================================================
        // INICIALITZAR UNA CAIXA A CADA SECCIÓ
        // =====================================================

        afegirCaixaJunt();

        afegirCaixaSeparat();


    </script>
